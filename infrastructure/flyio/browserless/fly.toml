# fly.toml file generated for uptime-kuma on 2022-10-04T20:27:40+11:00

app = "bnick-browserless"
primary_region = "dfw"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[build]
  image = "ghcr.io/browserless/chromium:latest"

[env]
  NODE_ENV = "production"
  CONNECTION_TIMEOUT = "30000" #30 seconds
  MAX_CONCURRENT_SESSION = 10
  ENABLE_DEBUGGER = "false"
  ENABLE_CORS = "true"
  TOKEN = "2TOkzFOGWOch6GW9a96ad981cced9ddc0da2a2bb6df615c2e"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  internal_port = 3000
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"
  
  [[services.ports]]
    #force_https = false
    handlers = ["http"]
    port = 80
  
  [[services.ports]]
    handlers = ["tls","http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "10s"
    restart_limit = 0
    timeout = "2s"

